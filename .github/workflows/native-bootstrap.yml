name: Native bootstrap (Expo)
# يولّد مشروع Expo بأحدث إصدار متوافق مع Expo Go ويحفظ package.json في فرع native-base
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create Expo project
        run: |
          npx --yes create-expo-app@latest native-gen --template default --no-install
          cd native-gen
          npm install
          npx expo install @supabase/supabase-js react-native-maps expo-location expo-notifications expo-haptics expo-secure-store expo-image-picker expo-localization @react-native-async-storage/async-storage react-native-url-polyfill expo-linking expo-device
          npx tsc --version
          node -e "const p=require('./package.json');console.log(JSON.stringify({name:p.name,expo:p.dependencies.expo,rn:p.dependencies['react-native'],react:p.dependencies.react,router:p.dependencies['expo-router']}))"
          ls
          ls app
      - name: Publish scaffold to branch native-base
        run: |
          cd native-gen
          rm -rf node_modules .expo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b native-base
          git rm -rq --cached . 2>/dev/null || true
          cd ..
          rm -rf native && mv native-gen native
          git add native
          git commit -m "Expo scaffold (generated)"
          git push -f origin native-base
