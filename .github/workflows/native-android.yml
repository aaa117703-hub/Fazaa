name: Native Android APK
# يبني APK أصلي. للتشغيل: عدّل native/android.trigger أو شغّله يدوياً بعد الدمج بـ main
on:
  workflow_dispatch:
  push:
    branches: ['native-app', 'native-v3']
    paths: ['.github/workflows/native-android.yml', 'native/android.trigger']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g"
      - uses: actions/upload-artifact@v4
        with:
          name: sanad-jaik-native-apk
          path: native/android/app/build/outputs/apk/release/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk sanad-jaik-native.apk
          gh release create "native-android-${{ github.run_number }}" sanad-jaik-native.apk --title "سند جايك (أندرويد) APK #${{ github.run_number }}" --notes "ملف APK للتجربة على أندرويد (معالجات ARM: 32 و64 بت، يغطي كل الهواتف الحقيقية). فعّل «التثبيت من مصادر غير معروفة» ثم افتحه."
