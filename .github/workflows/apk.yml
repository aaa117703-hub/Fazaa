name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/apk/**', '.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Capacitor and add Android
        working-directory: .github/apk
        run: |
          npm install
          npx cap add android
      - name: Permissions, icons, version
        working-directory: .github/apk
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' "$M"
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}; mkdir -p $R/mipmap-$n
            convert ../../icon-512.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_foreground.png
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build debug APK
        working-directory: .github/apk/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/apk/android/app/build/outputs/apk/debug/app-debug.apk sanad-jaik.apk
          gh release create "apk-${{ github.run_number }}" sanad-jaik.apk --title "سند جايك APK #${{ github.run_number }}" --notes "نسخة أندرويد للاختبار. حمّل sanad-jaik.apk وثبّته." 
      - uses: actions/upload-artifact@v4
        with: { name: sanad-jaik-apk, path: sanad-jaik.apk }
