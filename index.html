(function () {
  try {
    var s = JSON.parse(localStorage.getItem('sanad_settings') || '{}');
    var t = s.theme || 'auto';
    if (t === 'auto') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    if (s.reduceMotion) document.documentElement.classList.add('reduce-motion');
  } catch (e) {}
})();
</script>

<script>
(function () {
  var s = document.getElementById('splash');
  if (!s) return;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.classList.contains('reduce-motion');
  if (reduce) { s.remove(); return; }
  try { document.getElementById('sp-tip').textContent = window.F && F.randomTip ? F.randomTip() : ''; } catch (e) {}
  var done = function () {
    if (!s.parentNode) return;
    s.classList.add('out');
    document.dispatchEvent(new Event('splash-out'));
    setTimeout(function () { if (s.parentNode) s.remove(); }, 600);
  };
  setTimeout(done, 5000);
  s.addEventListener('click', done);
})();
</script>
