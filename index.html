<meta name="theme-color" content="#101214">
<script>
/* تطبيق المظهر المحفوظ قبل الرسم حتى ما يومض */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('sanad_settings') || '{}');
    var t = s.theme || 'auto';
    if (t === 'auto') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    if (s.reduceMotion) document.documentElement.classList.add('reduce-motion');
  } catch (e) {}
})();
</script>

<div id="splash" aria-hidden="true">
  <div class="sp-glow"></div>
  <div class="sp-logo">
    <i class="sp-pulse"></i><i class="sp-pulse r2"></i>
    <svg viewBox="0 0 100 100" role="presentation">
      <path class="sp-arch" pathLength="1" d="M19 86V51a31 31 0 0 1 62 0V86" fill="none" stroke="#FF6B2C" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <circle class="sp-dot" cx="50" cy="40" r="6.5" fill="#FF6B2C"/>
      <path class="sp-chev" d="M35.5 73L50 57.5L64.5 73" fill="none" stroke="#F5F5F0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="sp-name">سند جايك</div>
  <div class="sp-tag">سندك بضغطة</div>
  <div class="sp-tip"><b>نصيحة</b><span id="sp-tip"></span></div>
  <i class="sp-bar"></i>
</div>
<script>
(function () {
  var s = document.getElementById('splash');
  if (!s) return;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.classList.contains('reduce-motion');
  if (reduce) { s.remove(); return; }
  try { document.getElementById('sp-tip').textContent = window.F && F.randomTip ? F.randomTip() : ''; } catch (e) {}
  var done = function () {
    if (!s.parentNode) return;
    s.classList.add('out');
    document.dispatchEvent(new Event('splash-out'));
    setTimeout(function () { if (s.parentNode) s.remove(); }, 600);
  };
  setTimeout(done, 5000);
  s.addEventListener('click', done);
})();
</script>
